version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
      - java
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch
    # Major bumps of these need dedicated migrations (newer Java baseline / breaking
    # APIs), so don't open PRs for them until tackled deliberately.
    ignore:
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.graalvm*"
        update-types: ["version-update:semver-major"]
