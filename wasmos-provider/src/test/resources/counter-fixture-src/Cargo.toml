[package]
name = "counter-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
wee_alloc = "0.4"

[package.metadata.component]
package = "tegmentum:counter"

[package.metadata.component.target]
world = "counter-world"
path = "wit/counter.wit"

[profile.release]
opt-level = "s"
strip = "debuginfo"
lto = true
codegen-units = 1
